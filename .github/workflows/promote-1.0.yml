name: Promote Avata official 1.0
on:
  push:
    branches: [main]
    paths:
      - 'releases/1.0/**'
      - '.github/workflows/promote-1.0.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avata-release-1-0
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify identical release assets and signed bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $assetRoot = Join-Path $env:GITHUB_WORKSPACE 'releases/58.17.4/assets'
          $product = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'releases/1.0/product-release.json') -Raw | ConvertFrom-Json
          if ($product.ProductVersion -cne '1.0' -or $product.BuildVersion -cne '58.17.4' -or $product.Tag -cne 'v1.0' -or @($product.Assets.PSObject.Properties).Count -ne 4) { throw 'PRODUCT_MAPPING' }
          foreach ($asset in $product.Assets.PSObject.Properties) {
            if ((Get-FileHash (Join-Path $assetRoot $asset.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $asset.Value) { throw 'PROMOTION_CHANGED_BYTES' }
          }
          $expected = @('Avata_kor-58.17.4.zip','Avata_58.17.4_Verification.zip','avata-update.json')
          $seen = @{}
          foreach ($line in Get-Content (Join-Path $assetRoot 'SHA256SUMS.txt')) {
            if ($line -cnotmatch '^([a-f0-9]{64})  ([A-Za-z0-9_.-]+)$') { throw 'HASH_LIST_FORMAT' }
            $hash = $matches[1]; $name = $matches[2]
            if ($name -cnotin $expected -or $seen.ContainsKey($name)) { throw 'HASH_LIST_NAME' }
            $seen[$name] = $true
            if ((Get-FileHash (Join-Path $assetRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) { throw 'HASH_MISMATCH' }
          }
          if ($seen.Count -ne 3) { throw 'HASH_LIST_INCOMPLETE' }
          $kit = Join-Path $env:RUNNER_TEMP 'avata-public-kit'
          Expand-Archive (Join-Path $assetRoot 'Avata_58.17.4_Verification.zip') $kit
          . (Join-Path $kit 'host/At58.Ops.ps1')
          . (Join-Path $kit 'host/At58.Update.ps1')
          $manifest = Up-Envelope (Join-Path $assetRoot 'avata-update.json')
          if ($manifest.Version -cne '58.17.4' -or $manifest.Id -cne 'bundle-235855b5c0f305d87fb679b6' -or $manifest.ManifestHash -cne '855220b13551f257b549f2e7c71ac3fc38d5970837747874e8b795373a639288') { throw 'RELEASE_IDENTITY' }
          $expanded = Join-Path $env:RUNNER_TEMP 'avata-signed-bundle'
          Up-Extract (Join-Path $assetRoot 'Avata_kor-58.17.4.zip') $expanded $manifest
          foreach ($name in @('release.json') + @(Up-Files)) {
            if ((Ops-Hash (Join-Path $expanded $name)) -cne (Ops-Hash (Join-Path $kit ('bundle/' + $name)))) { throw 'KIT_BUNDLE_MISMATCH' }
          }
          Write-Output 'PROMOTION VERIFIED: official 1.0 is byte-identical to tested build 58.17.4.'
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish verified signed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v1.0
          assets=releases/58.17.4/assets
          (cd "$assets" && sha256sum --check SHA256SUMS.txt)
          if gh release view "$tag" --json isDraft --jq '.isDraft' > release-draft.txt 2>release-lookup.txt; then
            test "$(cat release-draft.txt)" = true || { echo "Published release is immutable; refusing to replace assets."; exit 1; }
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Avata 1.0 (build 58.17.4)" --notes-file releases/1.0/RELEASE_NOTES.md
          fi
          gh release upload "$tag" "$assets/Avata_kor-58.17.4.zip" "$assets/Avata_58.17.4_Verification.zip" "$assets/avata-update.json" "$assets/SHA256SUMS.txt" --clobber
          gh release edit "$tag" --draft=false --latest
  verify-public:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify public feed with original updater
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = Join-Path $env:RUNNER_TEMP 'avata-verify'
          $assets = Join-Path $env:GITHUB_WORKSPACE 'releases/58.17.4/assets'
          Expand-Archive (Join-Path $assets 'Avata_58.17.4_Verification.zip') $kit
          . (Join-Path $kit 'tests/original/At58.Ops.ps1')
          . (Join-Path $kit 'tests/original/At58.Update.ps1')
          $synthetic = Join-Path $env:RUNNER_TEMP 'avata-synthetic-host'
          Ops-WriteJson (Join-Path $synthetic 'settings.json') @{Enabled=$true;FeedUrl='https://github.com/crosnuu12/Avata-kor-releases/releases/latest/download/avata-update.json'}
          Ops-WriteJson (Join-Path $synthetic 'active.json') (Ops-ReadJson (Join-Path $kit 'tests/original/channel/ready.json'))
          $remote = Up-RemoteRefresh $synthetic
          if ($remote.State -cne 'CHECKED' -or $remote.Version -cne '58.17.4') { throw ('PUBLIC_DOWNLOAD_FAILED_' + $remote.Code) }
          $offer = Up-Offer (Join-Path $synthetic 'remote-channel')
          if (!$offer -or $offer.Id -cne 'bundle-235855b5c0f305d87fb679b6') { throw 'PUBLIC_IDENTITY' }
          Ops-WriteJson (Join-Path $synthetic 'active.json') @{Id=$offer.Id;Version=$offer.Version;ManifestHash=$offer.ManifestHash}
          $same = Up-RemoteRefresh $synthetic
          if ($same.State -cne 'CHECKED') { throw 'PUBLIC_SAME_VERSION' }
          Write-Output 'PUBLIC FEED CHECKS PASSED; signature and download verified by original updater.'
