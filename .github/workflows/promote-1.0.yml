name: Avata 1.0 promotion on hold
on:
  push:
    branches: [main]
    paths:
      - 'releases/1.0/**'
      - '.github/workflows/promote-1.0.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avata-release-1-0
  cancel-in-progress: true
jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - name: Promotion paused for diagnostics
        run: echo "Official 1.0 promotion is on hold pending alert diagnostics."
