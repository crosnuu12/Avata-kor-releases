name: Hold Avata 1.1.1 for diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-58.17.7.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avata-release-1-1-1
  cancel-in-progress: true
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Hold the pending candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.1.1 --json targetCommitish,isDraft > candidate.json 2>lookup.txt; then
            test "$(jq -r '.targetCommitish' candidate.json)" = 01bb2093062c4de422d0bcbfe93efd4e6d57263e
            gh release edit v1.1.1 --draft=true
            gh release edit v1.0.1 --latest
          fi
          echo "1.1.1 publication is paused while runtime alert details are checked."
