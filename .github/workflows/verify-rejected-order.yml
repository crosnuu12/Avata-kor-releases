name: Verify Avata 1.1.8 rejected order recovery
on:
  pull_request:
    paths:
      - 'releases/1.1.8/**'
      - 'CURRENT_SOURCE.json'
      - 'PROJECT_INDEX.md'
      - 'README.md'
      - '.github/workflows/verify-rejected-order.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avata-1-1-8-rejected-order-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify signed assets, bundle and Windows regression suite
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check cryptography==50.0.2
          if($LASTEXITCODE -ne 0){throw 'DEPENDENCY_FAILED'}
          python releases/1.1.8/Verify-Assets.py releases/1.1.8
          if($LASTEXITCODE -ne 0){throw 'ASSETS_FAILED'}
          $kit=Join-Path $env:RUNNER_TEMP 'avata-1.1.8-kit'
          Expand-Archive -LiteralPath releases/1.1.8/assets/Avata_58.17.14_Verification.zip -DestinationPath $kit
          . (Join-Path $kit 'host/At58.Ops.ps1')
          . (Join-Path $kit 'host/At58.Update.ps1')
          $manifest=Get-Content (Join-Path $kit 'bundle/release.json') -Raw | ConvertFrom-Json
          $checked=Up-Validate (Join-Path $kit 'bundle') (Ops-Hash (Join-Path $kit 'bundle/release.json'))
          if($checked.Version -cne '58.17.14' -or $manifest.Version -cne '58.17.14'){throw 'CANDIDATE_INVALID'}
          & powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy RemoteSigned -File (Join-Path $kit 'Run-Checks.ps1')
          if($LASTEXITCODE -ne 0){throw 'REGRESSION_FAILED'}
          & powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy RemoteSigned -File (Join-Path $kit 'Test-TrayRestore.ps1') -HostedRunner
          if($LASTEXITCODE -ne 0){throw 'TRAY_FAILED'}
          & powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy RemoteSigned -File (Join-Path $kit 'Test-DesktopStartup.ps1')
          if($LASTEXITCODE -ne 0){throw 'DESKTOP_FAILED'}
