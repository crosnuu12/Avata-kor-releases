name: Publish Avata 58.17.2
on:
  push:
    branches: [main]
    paths:
      - 'releases/58.17.2/**'
      - '.github/workflows/publish-58.17.2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avata-release-58-17-2
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify hashes, signature and Windows 5.1 tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $assetRoot = Join-Path $env:GITHUB_WORKSPACE 'releases/58.17.2/assets'
          $expected = @('Avata_kor-58.17.2.zip','Avata_58.17.2_Update_Kit.zip','avata-update.json')
          $seen = @{}
          foreach ($line in Get-Content (Join-Path $assetRoot 'SHA256SUMS.txt')) {
            if ($line -cnotmatch '^([a-f0-9]{64})  ([A-Za-z0-9_.-]+)$') { throw 'HASH_LIST_FORMAT' }
            $hash = $matches[1]; $name = $matches[2]
            if ($name -cnotin $expected -or $seen.ContainsKey($name)) { throw 'HASH_LIST_NAME' }
            $seen[$name] = $true
            if ((Get-FileHash (Join-Path $assetRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) { throw 'HASH_MISMATCH' }
          }
          if ($seen.Count -ne 3) { throw 'HASH_LIST_INCOMPLETE' }
          $kit = Join-Path $env:RUNNER_TEMP 'avata-public-kit'
          Expand-Archive (Join-Path $assetRoot 'Avata_58.17.2_Update_Kit.zip') $kit
          . (Join-Path $kit 'Install-Rollover.ps1')
          $null = IP-CheckPackage $kit
          . (Join-Path $kit 'host/At58.Ops.ps1')
          . (Join-Path $kit 'host/At58.Update.ps1')
          $manifest = Up-Envelope (Join-Path $assetRoot 'avata-update.json')
          if ($manifest.Version -cne '58.17.2' -or $manifest.Id -cne 'bundle-11d351c97ecc4990e1dab9dd' -or $manifest.ManifestHash -cne 'e55eda8a6d05ad3adf76d502c76923c71a95a883233b747d2cf936711888f800') { throw 'RELEASE_IDENTITY' }
          $expanded = Join-Path $env:RUNNER_TEMP 'avata-signed-bundle'
          Up-Extract (Join-Path $assetRoot 'Avata_kor-58.17.2.zip') $expanded $manifest
          foreach ($name in @('release.json') + @(Up-Files)) {
            if ((Ops-Hash (Join-Path $expanded $name)) -cne (Ops-Hash (Join-Path $kit ('bundle/' + $name)))) { throw 'KIT_BUNDLE_MISMATCH' }
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File (Join-Path $kit 'Run-Checks.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_CHECKS_FAILED' }
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish verified signed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v58.17.2
          assets=releases/58.17.2/assets
          (cd "$assets" && sha256sum --check SHA256SUMS.txt)
          if gh release view "$tag" --json isDraft --jq '.isDraft' > release-draft.txt 2>release-lookup.txt; then
            test "$(cat release-draft.txt)" = true || { echo "Published release is immutable; refusing to replace assets."; exit 1; }
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Avata 58.17.2" --notes-file releases/58.17.2/RELEASE_NOTES.md
          fi
          gh release upload "$tag" "$assets/Avata_kor-58.17.2.zip" "$assets/Avata_58.17.2_Update_Kit.zip" "$assets/avata-update.json" "$assets/SHA256SUMS.txt" --clobber
          gh release edit "$tag" --draft=false --latest
