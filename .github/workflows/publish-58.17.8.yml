name: Publish Avata 1.1.2 automatic update
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: avata-release-1-1-2
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require exact source validation and install signer dependency
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $run=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/41840405969" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $run.head_sha -cne 'cd8576d58bc897fb1174186df0830daadc9c7fd1' -or $run.conclusion -cne 'success' -or $run.status -cne 'completed'){throw 'SOURCE_NOT_VERIFIED'}
          python -m pip install --disable-pip-version-check cryptography==50.0.2
          if($LASTEXITCODE -ne 0){throw 'DEPENDENCY_FAILED'}
      - name: Sign with the existing installed trust key
        shell: powershell
        env:
          AVATA_UPDATE_SIGNING_KEY: ${{ secrets.AVATA_UPDATE_SIGNING_KEY }}
          AVATA_UPDATE_SIGNING_PASSWORD: ${{ secrets.AVATA_UPDATE_SIGNING_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'features/telegram-start-1.1.2/Avata_1.1.2_Telegram_Verification.zip'
          $assets=Join-Path $env:RUNNER_TEMP 'avata-signed-assets'
          python releases/1.1.2/package_release.py --candidate $candidate --output $assets --sign
          if($LASTEXITCODE -ne 0){throw 'SIGNING_NOT_COMPLETED_NO_RELEASE_CHANGED'}
          $kit=Join-Path $env:RUNNER_TEMP 'avata-signed-kit'
          Expand-Archive -LiteralPath $candidate -DestinationPath $kit
          & releases/1.1.2/Verify-Package.ps1 -Kit $kit -Assets $assets -RequireSignature
      - name: Publish versioned release, verify, and promote the automatic-update feed
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $assets=Join-Path $env:RUNNER_TEMP 'avata-signed-assets'
          $kit=Join-Path $env:RUNNER_TEMP 'avata-signed-kit'
          . (Join-Path $kit 'tests/original/At58.Ops.ps1')
          . (Join-Path $kit 'tests/original/At58.Update.ps1')
          $signed=Up-Envelope (Join-Path $assets 'avata-update.json')
          foreach($releaseTag in @('v58.17.8','v1.1.2')){
            $savedPreference=$ErrorActionPreference
            try{$ErrorActionPreference='Continue';$lookup=gh release view $releaseTag --json isDraft 2>$null;$lookupExit=$LASTEXITCODE}
            finally{$ErrorActionPreference=$savedPreference}
            if($lookupExit -eq 0){
              if(!(($lookup|ConvertFrom-Json).isDraft)){throw 'PUBLISHED_RELEASE_IS_IMMUTABLE'}
            }else{
              gh release create $releaseTag --draft --target $env:GITHUB_SHA --title 'Avata 1.1.2 (build 58.17.8)' --notes-file releases/1.1.2/RELEASE_NOTES.md
              if($LASTEXITCODE -ne 0){throw 'DRAFT_RELEASE_FAILED'}
            }
            gh release upload $releaseTag (Join-Path $assets 'Avata_kor-58.17.8.zip') (Join-Path $assets 'Avata_58.17.8_Verification.zip') (Join-Path $assets 'avata-update.json') (Join-Path $assets 'SHA256SUMS.txt') --clobber
            if($LASTEXITCODE -ne 0){throw 'RELEASE_UPLOAD_FAILED'}
          }
          function Verify-PublicFeed([string]$feed){
            $checkRoot=Join-Path $env:RUNNER_TEMP ('avata-public-'+[guid]::NewGuid().ToString('N'))
            Ops-WriteJson (Join-Path $checkRoot 'settings.json') @{Enabled=$true;FeedUrl=$feed}
            Ops-WriteJson (Join-Path $checkRoot 'active.json') @{Schema='AT58-OFFER-1';Id='bundle-c698595148d2fe89ffabb7c3';Version='58.17.7';ManifestHash='13f7a85352608b05a7b700e708959af597f38b4919b029b4a0e8a1e04f09fab2'}
            $remote=Up-RemoteRefresh $checkRoot
            if($remote.State -cne 'CHECKED' -or $remote.Version -cne '58.17.8'){throw 'PUBLIC_UPDATE_VERIFICATION_FAILED'}
            $offer=Up-Offer (Join-Path $checkRoot 'remote-channel')
            if($offer.Id -cne $signed.Id -or $offer.ManifestHash -cne $signed.ManifestHash){throw 'PUBLIC_UPDATE_IDENTITY'}
          }
          gh release edit v58.17.8 --draft=false --latest=false
          if($LASTEXITCODE -ne 0){throw 'VERSIONED_PUBLICATION_FAILED'}
          Verify-PublicFeed 'https://github.com/crosnuu12/Avata-kor-releases/releases/download/v58.17.8/avata-update.json'
          gh release edit v1.1.2 --draft=false --latest
          if($LASTEXITCODE -ne 0){throw 'CHANNEL_PROMOTION_FAILED'}
          Verify-PublicFeed 'https://github.com/crosnuu12/Avata-kor-releases/releases/latest/download/avata-update.json'
          Write-Output 'AUTO-UPDATE PUBLISHED AND VERIFIED: 1.1.2 / 58.17.8. No real account, live spreadsheet or broker order was accessed by this job.'
