name: Release Avata 1.1.9 reject resume
on:
  push:
    branches: [main, fix/reject-resume-20261107]
    paths:
      - 'releases/1.1.9/assets/**'
      - 'releases/1.1.9/Build-Assets.py'
      - 'releases/1.1.9/Verify-Assets.py'
      - 'releases/1.1.9/Publish.ps1'
      - '.github/workflows/release-reject-resume.yml'
permissions:
  contents: read
concurrency:
  group: avata-1-1-9-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify signed package and complete Windows regression suite
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check cryptography==50.0.2
          if($LASTEXITCODE -ne 0){throw 'DEPENDENCY_FAILED'}
          python releases/1.1.9/Verify-Assets.py releases/1.1.9
          if($LASTEXITCODE -ne 0){throw 'ASSETS_FAILED'}
          $kit=Join-Path $env:RUNNER_TEMP 'avata-1.1.9-kit'
          Expand-Archive -LiteralPath releases/1.1.9/assets/Avata_58.17.15_Verification.zip -DestinationPath $kit
          . (Join-Path $kit 'host/At58.Ops.ps1')
          . (Join-Path $kit 'host/At58.Update.ps1')
          $manifest=Up-Validate (Join-Path $kit 'bundle') (Ops-Hash (Join-Path $kit 'bundle/release.json'))
          if($manifest.Version -cne '58.17.15'){throw 'CANDIDATE_INVALID'}
          & powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy RemoteSigned -File (Join-Path $kit 'Run-Checks.ps1')
          if($LASTEXITCODE -ne 0){throw 'REGRESSION_FAILED'}
          & powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy RemoteSigned -File (Join-Path $kit 'Test-TrayRestore.ps1') -HostedRunner
          if($LASTEXITCODE -ne 0){throw 'TRAY_FAILED'}
          & powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy RemoteSigned -File (Join-Path $kit 'Test-DesktopStartup.ps1')
          if($LASTEXITCODE -ne 0){throw 'DESKTOP_FAILED'}
          python tools/Test-Prepare-Source.py
          if($LASTEXITCODE -ne 0){throw 'SOURCE_TEST_FAILED'}
          python tools/Prepare-Source.py --dest (Join-Path $env:RUNNER_TEMP 'avata-1.1.9-source')
          if($LASTEXITCODE -ne 0){throw 'SOURCE_RESTORE_FAILED'}
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish and verify signed public update from installed versions
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $kit=Join-Path $env:RUNNER_TEMP 'avata-1.1.9-kit'
          Expand-Archive -LiteralPath releases/1.1.9/assets/Avata_58.17.15_Verification.zip -DestinationPath $kit
          & releases/1.1.9/Publish.ps1 -Assets releases/1.1.9/assets -Kit $kit -PublicKey releases/key-20261104/public-key.xml
          if($LASTEXITCODE -ne 0){throw 'PUBLISH_FAILED'}
